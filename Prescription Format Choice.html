<style>

}

:root[data-theme="dark"]{
  --bg:#101215; --stage:#0A0B0D; --surface:#1A1D22; --ink:#F1F3F5; --ink-2:#A3ABB5; --line:#3A4048; --field:#15181C; --soft:#22262C;

  --primary:#F1F3F5; --on-primary:#101215;
  --danger:#F2A09B; --danger-tint:#3F1F1D;
  --ok:#8BD4A5; --ok-tint:#17301F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:20px 40px}

.page{max-width:1280px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

.body{flex:1;min-height:0;display:flex;flex-direction:column}

.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6em}

.toggle button{border:0;background:transparent;min-height:2.6em;padding:0 1.3em;border-radius:.6em;font-weight:700;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.card{border:1px solid var(--line);border-radius:1em;padding:1em;display:flex;flex-direction:column;gap:1em}

.link{display:inline-flex;align-items:center;gap:.3em;border:0;background:transparent;font-weight:700;padding:.4em .2em;min-height:2.6em;color:var(--ink-2)}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:1em}
.cur .g2{gap:.8em}
.fld{display:flex;flex-direction:column;gap:.4em;min-width:0}
.opt-t{font-weight:400;color:var(--ink-2)}
.sel,.inp{width:100%;min-height:3.5em;border:1px solid var(--line);background:var(--field);border-radius:.9em;padding:.4em .9em;display:flex;align-items:center;justify-content:space-between;gap:.5em;text-align:left;font:inherit;font-weight:400;color:var(--ink)}
.cur .sel,.cur .inp{min-height:2.8em;border-radius:.6em}
.enh .sel,.enh .inp{border-width:1.5px;border-color:var(--ink-2)}
.sel .v{min-width:0;overflow-wrap:anywhere}
.sel .ph,.inp::placeholder{color:var(--ink-2)}

.cur textarea.inp.big{min-height:11em;font-size:1em}
textarea.inp.sig{min-height:5em}
.bad{border-color:var(--danger)!important;background:var(--danger-tint)}
.err{margin:.1em 0 0;color:var(--danger);font-weight:600;font-size:.95em;display:flex;gap:.4em;align-items:center}
.errbox{background:var(--danger-tint);color:var(--danger);border:1px solid var(--danger);border-radius:.8em;padding:.7em .9em;font-weight:600}
.qty{display:flex;border:1.5px solid var(--ink-2);border-radius:.9em;overflow:hidden;background:var(--field);min-height:3.6em}
.qty button{border:0;background:transparent;width:3.6em;display:grid;place-items:center;padding:0}
.qty button:hover{background:var(--soft)}
.qty output{flex:1;display:grid;place-items:center;font-weight:700;border-inline:1px solid var(--line)}
.qs{display:flex;flex-wrap:wrap;align-items:center;gap:.5em}
.qs span{color:var(--ink-2);font-size:.92em}
.qs button{min-height:2.8em;padding:0 1em;border:1px solid var(--line);background:var(--soft);border-radius:2em;font-weight:500}
.add{min-height:3.4em;border:1.5px dashed var(--line);background:transparent;border-radius:.9em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.4em;width:100%}
.cur .add{border-radius:.6em;font-weight:500;min-height:2.8em;border-width:1px}

.rx{background:var(--surface);border:1px solid var(--line);border-radius:.9em;padding:1em 1.1em;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.ok{display:flex;gap:.8em;align-items:center;background:var(--ok-tint);color:var(--ok);border-radius:.9em;padding:.9em 1em}
.ok .ms{font-size:2em}

.ft{flex:none;border-top:1px solid var(--line);padding:.75em 1.25em;display:flex;flex-direction:column;gap:.45em;background:var(--surface)}
.ft .saved{text-align:center;color:var(--ink-2);font-size:.82em}
.ft .row{display:flex;flex-wrap:wrap;gap:.6em}
.btn{min-height:3.6em;padding:0 1.3em;border:1px solid var(--line);background:var(--surface);border-radius:.9em;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;flex:1 1 6em}
.cur .btn{min-height:2.8em;border-radius:.6em;font-weight:500}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);flex:2 1 12em}
.cur .btn.pri{flex:1.4 1 9em;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.75em}
.tile{display:flex;align-items:center;gap:.9em;min-height:6em;padding:.5em 1.2em;border:1px solid var(--line);background:var(--surface);border-radius:1em;text-align:left;font-size:1.05em;font-weight:500}
.tile .ms{font-size:1.75em}
.tile[aria-pressed="true"]{background:var(--accent-tint);border:2px solid var(--accent-line)}
.tile[aria-pressed="true"] .ms{color:var(--accent)}
.tile.wide{grid-column:1/-1}
.q{margin:0;font-size:1.1em;font-weight:700}

.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-height:78%;background:var(--surface);border-radius:1.25em 1.25em 0 0;padding:1em 1.25em 1.25em;display:flex;flex-direction:column;gap:.75em}
.sheet header{display:flex;align-items:center;justify-content:space-between}
.sheet h3{margin:0;font-size:1.3em}
.search{display:flex;align-items:center;gap:.6em;border:1px solid var(--line);border-radius:.9em;min-height:3.3em;padding:0 .9em;background:var(--field)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;min-height:3em}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:.5em;min-height:0}
.prow{min-height:3.8em;padding:.4em 1em;border:1px solid var(--line);background:var(--surface);border-radius:.9em;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:.6em;overflow-wrap:anywhere}
.prow[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.prow.custom{border-style:dashed;color:var(--accent);font-weight:700}

@container m (min-width:520px){
  .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@container m (max-width:519px){

  .tiles{grid-template-columns:1fr}
  .tile.wide{grid-column:auto}
  .hrow .iconbtn{order:2}

  .toggle{width:100%}

  .ft .saved{display:none}

@container m (min-width:1000px){
  .enh .main{grid-template-columns:minmax(0,1fr) 22em}

}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8%);opacity:.6}to{transform:none;opacity:1}}}

<div class="page">
  <div class="top">
    <div>
      <h1>Prescription format choice</h1>
      <p>Doctors pick Simple text or Fill in fields. Try both versions, switch device, and change formats to see how the choice is remembered.</p>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Version" id="verseg">
        <button type="button" data-ver="cur" aria-pressed="false">Current UI</button>
        <button type="button" data-ver="enh" aria-pressed="true">Enhanced UI</button>
      </div>
      <div class="seg" role="group" aria-label="Device" id="devseg">
        <button type="button" data-dev="tablet" aria-pressed="true">Tablet</button>
        <button type="button" data-dev="mobile" aria-pressed="false">Mobile</button>
        <button type="button" data-dev="desktop" aria-pressed="false">Desktop</button>
      </div>
      <button type="button" class="ghost" id="reset">Start over</button>
      <button type="button" class="ghost" id="forget">Forget saved format</button>
    </div>
  </div>
  <div class="stage"><div class="modal enh" id="modal"></div></div>
  <p class="notes" id="note"></p>
</div>

<script>
(function(){
var DRUGS={
 'Amoxicillin':{strengths:['250 mg capsule','500 mg capsule','125 mg/5 mL suspension'],form:'Capsule'},
 'Paracetamol':{strengths:['500 mg tablet','120 mg/5 mL syrup'],form:'Tablet'},
 'Mefenamic acid':{strengths:['500 mg tablet','250 mg capsule'],form:'Tablet'},
 'Cefalexin':{strengths:['500 mg capsule','250 mg/5 mL suspension'],form:'Capsule'}
};
var BRANDS=['Biogesic','No brand (generic)'];
var FORMS=['Tablet','Capsule','Syrup','Suspension','Injection','Cream','Drops'];
var DEV={cur:{tablet:{w:700,h:700},mobile:{w:390,h:740},desktop:{w:720,h:700}},enh:{tablet:{w:780,h:760},mobile:{w:390,h:780},desktop:{w:1120,h:700}}};
var FMT=[{k:'plain',label:'Simple text',sub:'Write it like a note',icon:'notes'},{k:'fields',label:'Fill in fields',sub:'Drug, strength, quantity and instructions',icon:'checklist'}];
var DOCS=[['prescription','Prescription','medication'],['lab','Lab request','science'],['referral','Referral','redo'],['sick','Sick leave','bed'],['pwd','PWD cert','accessibility_new']];
var NOTES={
 cur:'<b>Current UI.</b> Same screen as today, plus one small switch (Simple text or Fill in fields) and, in Simple text, one text box instead of the medication fields. This is the fastest change to build.',
 enh:'<b>Enhanced UI.</b> Large format cards, bigger text with an A / A / A size control, clear errors, a live preview on desktop, and a choice to always start with your preferred format.'
};

var pref={last:null,pinned:null};
try{var raw=localStorage.getItem('rxfmt');if(raw){var p=JSON.parse(raw);pref.last=p.last||null;pref.pinned=p.pinned||null;}}catch(e){}
function savePref(){try{localStorage.setItem('rxfmt',JSON.stringify(pref));}catch(e){}}

var S;
function blank(){return {drug:'',brand:'',strength:'',form:'',qty:1,sig:''};}
function init(keep){
  S={ver:keep?S.ver:'enh',dev:keep?S.dev:'tablet',size:keep?S.size:0,step:2,doc:'prescription',
     fmt:pref.pinned||pref.last||'fields',text:'',meds:[blank()],notes:'',mode:'write',picker:null,err:false,issued:false,toast:''};
}
init(false);

var modal=document.getElementById('modal');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ic(n){return '<span class="ms" aria-hidden="true">'+n+'</span>';}
function ord(d){var j=d%10,k=d%100;return d+(k>=11&&k<=13?'th':j==1?'st':j==2?'nd':j==3?'rd':'th');}
function dateStr(){var d=new Date();return d.toLocaleString('en-US',{month:'long'})+' '+ord(d.getDate())+', '+d.getFullYear();}
function fl(k){return k==='plain'?'Simple text':'Fill in fields';}
function cur(){return S.ver==='cur';}
function L(t,req){return cur()&&req?t+' *':t;}

function sizesHtml(){
  return '<div class="sizes" role="group" aria-label="Text size"><span>Text size</span>'+[0,1,2].map(function(i){
    return '<button type="button" data-act="size" data-v="'+i+'" aria-pressed="'+(S.size===i)+'" aria-label="'+['Small','Medium','Large'][i]+' text"><span style="font-size:'+[.85,1.05,1.3][i]+'em;line-height:1">A</span></button>';}).join('')+'</div>';
}
function fmtChoice(){
  if(cur()){
    return '<div class="fmtc"><span class="lab">Format<em class="new">New</em></span><div class="seg2" role="radiogroup" aria-label="Prescription format">'+FMT.map(function(f){
      return '<button type="button" role="radio" data-act="fmt" data-v="'+f.k+'" aria-checked="'+(S.fmt===f.k)+'">'+f.label+'</button>';}).join('')+'</div></div>';
  }
  return '<div class="fmtwrap"><span class="lab" id="fmtlab">How do you want to write it?</span><div class="fmt" role="radiogroup" aria-labelledby="fmtlab">'+FMT.map(function(f){
    return '<button type="button" role="radio" data-act="fmt" data-v="'+f.k+'" aria-checked="'+(S.fmt===f.k)+'">'+ic(f.icon)+'<span><b>'+f.label+'</b><small>'+f.sub+'</small></span></button>';}).join('')+'</div></div>';
}
function pinStatus(){return pref.pinned?'Pinned. New prescriptions start in '+fl(pref.pinned)+'.':'Next time it opens in the format you used last.';}
function prefRow(){
  return '<div class="pinrow"><label class="pin"><input type="checkbox" id="pin"'+(pref.pinned===S.fmt?' checked':'')+'><span>Always start with '+fl(S.fmt)+'</span></label><span id="pinstat">'+pinStatus()+'</span></div>';
}
function hasFields(){return S.meds.some(function(m){return m.drug||m.strength||m.sig.trim()||m.brand||m.form;})||S.notes.trim();}
function keptNote(){
  if(S.fmt==='plain'&&hasFields())return '<div class="keep">'+ic('info')+'<span>Your filled-in fields are kept if you switch back.</span></div>';
  if(S.fmt==='fields'&&S.text.trim())return '<div class="keep">'+ic('info')+'<span>Your typed text is kept if you switch back.</span></div>';
  return '';
}
function sel(kind,label,val,ph,req,i,bad){
  return '<div class="fld"><label id="l'+kind+i+'">'+label+'</label><button type="button" class="sel'+(bad?' bad':'')+'" data-act="pick" data-kind="'+kind+'" data-i="'+i+'" aria-labelledby="l'+kind+i+'"><span class="'+(val?'v':'ph')+'">'+esc(val||ph)+'</span>'+ic('keyboard_arrow_down')+'</button></div>';
}
function medCard(m,i){
  var b=function(v){return S.err&&!v;};
  var head=cur()?'<div class="chead"><span class="num">'+(i+1)+'</span><button type="button" class="link" data-act="remove" data-i="'+i+'" aria-label="Remove medication '+(i+1)+'">'+ic('delete')+'</button></div>'
               :'<div class="chead"><b>Medication '+(i+1)+'</b><button type="button" class="link" data-act="remove" data-i="'+i+'">'+ic('delete')+'Remove</button></div>';
  var qty=cur()?'<input class="inp" type="text" inputmode="numeric" data-field="qty" data-i="'+i+'" value="'+m.qty+'" aria-labelledby="lq'+i+'">'
    :'<div class="qty" role="group" aria-labelledby="lq'+i+'"><button type="button" data-act="qminus" data-i="'+i+'" aria-label="Decrease quantity">'+ic('remove')+'</button><output>'+m.qty+'</output><button type="button" data-act="qplus" data-i="'+i+'" aria-label="Increase quantity">'+ic('add')+'</button></div>';
  return '<section class="card">'+head+
   '<div class="g2">'+sel('drug',L('Drug',1),m.drug,'Search or type drug name…',1,i,b(m.drug))+sel('brand',L('Brand Name',0)+(cur()?'':' <span class="opt-t">(optional)</span>'),m.brand,'e.g. Biogesic',0,i,false)+'</div>'+
   '<div class="g2">'+sel('strength',L('Strength',1),m.strength,'e.g. 500mg tablet',1,i,b(m.strength))+sel('form',L('Dosage Form',1),m.form,'e.g. Oral',1,i,b(m.form))+'</div>'+
   '<div class="fld"><span class="lab" id="lq'+i+'">'+L('Quantity',1)+'</span>'+qty+'</div>'+
   '<div class="fld"><label for="sig'+i+'">'+L('Sig / Patient Instructions',1)+'</label><textarea class="inp sig'+(b(m.sig.trim())?' bad':'')+'" id="sig'+i+'" data-field="sig" data-i="'+i+'" placeholder="e.g. Take one (1) tablet at night after meals" autocomplete="off">'+esc(m.sig)+'</textarea></div></section>';
}
function fieldsBody(){
  return (S.err?'<div class="errbox" role="alert">Fill in the highlighted fields to continue.</div>':'')+S.meds.map(medCard).join('')+
   '<button type="button" class="add" data-act="addmed">'+ic('add')+(cur()?'Add Medication':'Add another medication')+'</button>'+
   '<div class="fld"><label for="notes">'+(cur()?'Additional Notes':'Additional notes')+'</label><textarea class="inp" id="notes" data-field="notes" rows="2" placeholder="Optional notes for the patient or pharmacist…">'+esc(S.notes)+'</textarea></div>';
}
function plainBody(){
  var bad=S.err&&!S.text.trim();
  return '<div class="fld"><label for="plain">'+(cur()?'Prescription *':'Prescription')+'</label>'+
   '<textarea class="inp big'+(bad?' bad':'')+'" id="plain" data-field="text" placeholder="Type the prescription like a note, for example: Amoxicillin 500 mg capsule, 1 capsule every 8 hours for 7 days." autocomplete="off">'+esc(S.text)+'</textarea>'+
   (bad?'<p class="err" role="alert">'+ic('info')+'Write the prescription first.</p>':'')+'</div>'+
   (cur()?'':'<div class="qs"><span>Tap to add:</span>'+['Once daily','Every 8 hours','After meals','For 7 days'].map(function(t){return '<button type="button" data-act="qadd" data-v="'+t+'">'+t+'</button>';}).join('')+'</div>');
}
function rxHtml(){
  var body;
  if(S.fmt==='plain'){body=S.text.trim()?'<p class="pl">'+esc(S.text)+'</p>':'<p class="dim">Nothing written yet.</p>';}
  else{
    body=S.meds.map(function(m){return '<div class="m"><h4>'+esc(m.drug||'Drug')+(m.strength?' · '+esc(m.strength):'')+'</h4>'+(m.brand?'<p class="dim">'+esc(m.brand)+'</p>':'')+'<p>Quantity '+m.qty+(m.form?', '+esc(m.form):'')+'</p>'+(m.sig.trim()?'<p>'+esc(m.sig)+'</p>':'<p class="dim">Instructions</p>')+'</div>';}).join('')+
      (S.notes.trim()?'<div class="nt"><p class="dim">Notes</p><p>'+esc(S.notes)+'</p></div>':'');
  }
  return '<div class="rx"><div class="rh"><b>Rx</b><span>'+dateStr()+'</span></div>'+body+'</div>';
}
function formBody(){
  var top='<div class="toprow"><div class="datebtn">'+ic('calendar_today')+'<span>'+dateStr()+'</span></div><div class="toggle" role="group" aria-label="View"><button type="button" data-act="mode" data-v="write" aria-pressed="'+(S.mode==='write')+'">Write</button><button type="button" data-act="mode" data-v="preview" aria-pressed="'+(S.mode==='preview')+'">Preview</button></div></div>';
  var core=S.mode==='preview'?rxHtml():(S.fmt==='plain'?plainBody():fieldsBody());
  return fmtChoice()+prefRow()+keptNote()+top+core;
}
function footer(){
  return '<div class="ft"><span class="saved">Draft saved 9:20 AM</span><div class="row"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn" data-act="preview">Preview</button><button type="button" class="btn pri" data-act="issue">'+(cur()?'Issue Prescription':'Issue prescription')+'</button></div></div>';
}
function curView(){
  var chips=[['Sick Leave','bed'],['PWD Cert','accessibility_new'],['Referral','redo'],['Lab Request','science'],['Prescription','medication']].map(function(c,i){return '<span class="pill'+(i===4?' on':'')+'">'+ic(c[1])+c[0]+'</span>';}).join('');
  return '<div class="body"><div class="hd"><div class="ttl"><h2>Issue Medical Document</h2><small>Select a document type and fill in the details</small></div><div class="chips" id="chips">'+chips+'</div></div><div class="main"><div class="form" id="form">'+formBody()+'</div></div></div>'+footer();
}
function enhStep1(){
  var tiles=DOCS.map(function(d,i){return '<button type="button" class="tile'+(i===4?' wide':'')+'" data-act="doc" data-v="'+d[0]+'" aria-pressed="'+(S.doc===d[0])+'">'+ic(d[2])+'<span>'+d[1]+'</span></button>';}).join('');
  return '<div class="body"><div class="hd"><div class="hrow"><div class="ttl"><h2>New document</h2><small>Step 1 of 2</small></div>'+sizesHtml()+'<button type="button" class="iconbtn" data-act="close" aria-label="Close">'+ic('close')+'</button></div><div class="prog"><i class="on"></i><i></i></div></div><div class="main"><div class="form" id="form"><p class="q">What do you want to create?</p><div class="tiles">'+tiles+'</div></div></div></div>'+
   '<div class="ft"><div class="row"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn pri" data-act="next">Continue</button></div></div>';
}
function enhStep2(){
  return '<div class="body"><div class="hd"><div class="hbar"><button type="button" class="back" data-act="back">'+ic('chevron_left')+'Back</button><button type="button" class="iconbtn" data-act="close" aria-label="Close">'+ic('close')+'</button></div><div class="hrow"><div class="ttl"><h2>Prescription</h2><small>Step 2 of 2</small></div>'+sizesHtml()+'</div><div class="prog"><i class="on"></i><i class="on"></i></div></div>'+
   '<div class="main"><div class="form" id="form">'+formBody()+'</div><aside class="dock" aria-label="Live preview"><h3>Live preview</h3><div id="dockrx">'+rxHtml()+'</div></aside></div></div>'+footer();
}
function issuedView(){
  var hd=cur()?'<div class="hd"><div class="ttl"><h2>Issue Medical Document</h2></div></div>':'<div class="hd"><div class="ttl"><h2>Prescription</h2><small>Done</small></div></div>';
  return '<div class="body">'+hd+'<div class="main"><div class="form" id="form"><div class="ok">'+ic('picture_as_pdf')+'<div><b>Prescription PDF is ready</b><span class="t">Saved as '+(S.fmt==='plain'?'simple text':'fields')+'. The patient and doctor can open it.</span></div></div>'+rxHtml()+'</div></div></div>'+
   '<div class="ft"><div class="row"><button type="button" class="btn" data-act="edit">Edit prescription</button><button type="button" class="btn pri" data-act="done">Done</button></div></div>';
}
function options(kind,i){
  var m=S.meds[i];
  if(kind==='drug')return Object.keys(DRUGS);
  if(kind==='brand')return BRANDS;
  if(kind==='form')return FORMS;
  return DRUGS[m.drug]?DRUGS[m.drug].strengths:[];
}
function listHtml(q){
  var p=S.picker,m=S.meds[p.i],cur_=m[p.kind],all=options(p.kind,p.i),ql=q.trim().toLowerCase();
  var list=all.filter(function(o){return !ql||o.toLowerCase().indexOf(ql)>-1;});
  var h=list.map(function(o){return '<button type="button" class="prow" data-act="choose" data-v="'+esc(o)+'" aria-pressed="'+(o===cur_)+'"><span>'+esc(o)+'</span>'+(o===cur_?ic('check'):'')+'</button>';}).join('');
  if(p.kind!=='form'&&q.trim()&&all.map(function(o){return o.toLowerCase();}).indexOf(ql)<0)h+='<button type="button" class="prow custom" data-act="choose" data-v="'+esc(q.trim())+'"><span>Use “'+esc(q.trim())+'”</span></button>';
  return h||'<p class="empty">No matches.</p>';
}
function pickerHtml(){
  if(!S.picker)return '';
  var t={drug:'Drug',brand:'Brand name',strength:'Strength',form:'Dosage form'}[S.picker.kind];
  return '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+t+'"><header><h3>'+t+'</h3><button type="button" class="iconbtn" data-act="pclose" aria-label="Close">'+ic('close')+'</button></header><div class="search">'+ic('search')+'<input id="psearch" type="text" placeholder="Search or type…" autocomplete="off"></div><div class="plist" id="plist">'+listHtml('')+'</div></div></div>';
}
function render(){
  var f=document.getElementById('form'),top=f?f.scrollTop:0;
  var bd=modal.querySelector('.body'),btop=bd?bd.scrollTop:0;
  var c=DEV[S.ver][S.dev];
  modal.className='modal '+S.ver;
  modal.setAttribute('data-size',cur()?0:S.size);
  modal.style.setProperty('--w',c.w+'px');
  modal.style.setProperty('--h',c.h+'px');
  var view=S.issued?issuedView():(cur()?curView():(S.step===1?enhStep1():enhStep2()));
  modal.innerHTML=view+pickerHtml()+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
  var nf=document.getElementById('form');if(nf)nf.scrollTop=top;
  var nb=modal.querySelector('.body');if(nb)nb.scrollTop=btop;
  var ch=document.getElementById('chips');if(ch)ch.scrollLeft=ch.scrollWidth;
  Array.prototype.forEach.call(document.querySelectorAll('#devseg button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-dev')===S.dev);});
  Array.prototype.forEach.call(document.querySelectorAll('#verseg button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-ver')===S.ver);});
  document.getElementById('note').innerHTML=NOTES[S.ver];
  if(S.picker){var s=document.getElementById('psearch');if(s)s.focus();}
}
var tt;
function toast(t){S.toast=t;render();clearTimeout(tt);tt=setTimeout(function(){S.toast='';var e=modal.querySelector('.toast');if(e)e.remove();},2200);}
function updateDock(){var d=document.getElementById('dockrx');if(d)d.innerHTML=rxHtml();}
function validate(){
  if(S.fmt==='plain')return !!S.text.trim();
  return S.meds.every(function(m){return m.drug&&m.strength&&m.form&&m.qty>=1&&m.sig.trim();});
}

modal.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),i=+t.getAttribute('data-i'),v=t.getAttribute('data-v');
  if(a==='scrim'){if(e.target!==t)return;S.picker=null;render();return;}
  if(a==='fmt'){S.fmt=v;S.err=false;S.mode='write';pref.last=v;savePref();render();return;}
  if(a==='size'){S.size=+v;render();return;}
  if(a==='doc'){S.doc=v;render();return;}
  if(a==='next'){if(S.doc!=='prescription'){toast('This ticket only covers the prescription form');return;}S.step=2;render();return;}
  if(a==='back'){S.step=1;S.picker=null;render();return;}
  if(a==='close'){toast('Cancelled (prototype)');return;}
  if(a==='preview'){S.mode='preview';render();return;}
  if(a==='mode'){S.mode=v;render();return;}
  if(a==='issue'){
    if(!validate()){S.err=true;S.mode='write';render();var b=modal.querySelector('.bad');if(b)b.scrollIntoView({block:'center'});return;}
    S.err=false;S.issued=true;pref.last=S.fmt;savePref();render();return;
  }
  if(a==='edit'){S.issued=false;S.mode='write';render();return;}
  if(a==='done'){var keepV=S.ver,keepD=S.dev,keepZ=S.size;init(false);S.ver=keepV;S.dev=keepD;S.size=keepZ;render();return;}
  if(a==='pick'){S.picker={kind:t.getAttribute('data-kind'),i:i};render();return;}
  if(a==='pclose'){S.picker=null;render();return;}
  if(a==='choose'){var p=S.picker,m=S.meds[p.i];m[p.kind]=v;if(p.kind==='drug'){m.strength='';if(DRUGS[v]&&!m.form)m.form=DRUGS[v].form;}S.picker=null;render();return;}
  if(a==='qminus'){S.meds[i].qty=Math.max(1,S.meds[i].qty-1);render();return;}
  if(a==='qplus'){S.meds[i].qty+=1;render();return;}
  if(a==='addmed'){S.meds.push(blank());render();var f=document.getElementById('form');if(f)f.scrollTop=f.scrollHeight;return;}
  if(a==='remove'){if(S.meds.length>1)S.meds.splice(i,1);else S.meds[0]=blank();render();return;}
  if(a==='qadd'){var ta=document.getElementById('plain');S.text+=(S.text&&!/\s$/.test(S.text)?' ':'')+v;if(ta){ta.value=S.text;ta.classList.remove('bad');ta.focus();}updateDock();return;}
});
modal.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='psearch'){document.getElementById('plist').innerHTML=listHtml(t.value);return;}
  var f=t.getAttribute&&t.getAttribute('data-field');if(!f)return;
  t.classList.remove('bad');
  if(f==='text')S.text=t.value;
  if(f==='notes')S.notes=t.value;
  if(f==='sig')S.meds[+t.getAttribute('data-i')].sig=t.value;
  if(f==='qty')S.meds[+t.getAttribute('data-i')].qty=Math.max(1,parseInt(t.value,10)||1);
  updateDock();
});
modal.addEventListener('change',function(e){
  if(e.target.id==='pin'){pref.pinned=e.target.checked?S.fmt:null;savePref();var s=document.getElementById('pinstat');if(s)s.textContent=pinStatus();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.picker){S.picker=null;render();}});
document.getElementById('devseg').addEventListener('click',function(e){var b=e.target.closest('[data-dev]');if(!b)return;S.dev=b.getAttribute('data-dev');S.picker=null;render();});
document.getElementById('verseg').addEventListener('click',function(e){var b=e.target.closest('[data-ver]');if(!b)return;var d=S.dev,z=S.size;init(false);S.ver=b.getAttribute('data-ver');S.dev=d;S.size=z;render();});
document.getElementById('reset').addEventListener('click',function(){var v=S.ver,d=S.dev,z=S.size;init(false);S.ver=v;S.dev=d;S.size=z;render();});
document.getElementById('forget').addEventListener('click',function(){pref={last:null,pinned:null};savePref();var v=S.ver,d=S.dev,z=S.size;init(false);S.ver=v;S.dev=d;S.size=z;render();toast('Saved format cleared. Fill in fields is the default again');});
render();
})();
</script>

</body></html>
