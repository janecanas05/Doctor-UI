const ST={'5% Dextrose in Lactated Ringers':['250 mL, 500 mL and 1 L bottle/bag (IV infusion)','Composition: Dextrose - 50 g/L Na+ - 130 mmol/L K+ - 4 mmol/L Ca++ - 1.22 – 1.5 mmol/L Cl--109 mmol/L','Lactate - 28 mmol/L']};
const L={drug:'Drug',brand:'Brand name',strength:'Strength',form:'Dosage form',qty:'Quantity',freq:'Frequency',dur:'Duration',sig:'Sig / Patient instructions'};
const PH={drug:'Search or type drug name…',brand:'e.g. Biogesic',strength:'Choose or type',form:'Choose dosage form'};
const sOpts=()=>ST[S.drug]||['500 mg'];
const rows=(k,a)=>a.map(v=>`<button class="row ${S[k]==v?'on':''}" data-k="${k}" data-v="${v}">${v}</button>`).join('');
const chips=(k,a,c,x='')=>`<div class="chips cg ${x}" style="--c:${c}">${a.map(v=>`<button class="chip ${S[k]==v?'on':''}" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div>`;
const fld=k=>`<button class="field" data-sheet="${k}"><span class="${S[k]?'':'ph'}">${S[k]||PH[k]}</span><i>${ic('chev')}</i></button>`;
const ta=(k,p)=>`<textarea data-t="${k}" placeholder="${p}">${S[k]}</textarea>`;
const F={drug:()=>fld('drug'),brand:()=>fld('brand'),strength:()=>fld('strength'),form:()=>fld('form'),
qty:()=>`<div class="qf"><button data-q="-1" aria-label="Less">${ic('minus')}</button><b>${S.qty}</b><button data-q="1" aria-label="More">${ic('add')}</button></div>`,
freq:()=>chips('freq',O.freq,3,'f'),dur:()=>chips('dur',O.dur,6,'d'),
sig:()=>`<div class="ddw">${ta('sig','e.g. Inject 1 ampule IM once daily')}<div class="dd" id="sigdd" ${S.sigOpen?'':'hidden'}><small>Suggestions</small>${O.sig.map(v=>`<button data-sig="${v}">${v}</button>`).join('')}</div></div>`};
const cell=(k,s)=>`<div class="${s?'s2c':''}"><span class="lab">${L[k]}</span>${F[k]()}</div>`;
const pvh=()=>S.doc=='Medical certificate'?`<b>Medical certificate</b> <span class="ph">October 5th, 2026</span><hr>${S.purpose?`<p>Purpose: ${S.purpose}</p>`:'<p class="ph">Purpose</p>'}${S.find?`<p>${S.find}</p>`:'<p class="ph">Diagnosis / findings</p>'}${S.rem?`<p>${S.rem}</p>`:'<p class="ph">Remarks / recommendation</p>'}${S.notes?`<hr><p>${S.notes}</p>`:''}`:`<b>Rx</b> <span class="ph">October 5th, 2026</span><hr><p class="rx">${S.drug}</p>${S.strength?`<p>${S.strength}</p>`:''}<p>${S.form}, quantity ${S.qty}</p><p>${S.freq} for ${S.dur}</p>${S.sig?`<p>${S.sig}</p>`:'<p class="ph">Sig / patient instructions</p>'}${S.notes?`<hr><p>${S.notes}</p>`:''}`;
const paper=()=>`<div class="sheet" data-pv>${pvh()}</div>`;
const TS=()=>`<div class="ts"><span>Text size</span>${[[16,'.85rem'],[19,'1.1rem'],[22,'1.35rem']].map(([s,f])=>`<button data-fs="${s}" class="${S.fs==s?'on':''}" style="font-size:${f}" aria-label="Text size ${s}">A</button>`).join('')}</div>`;

function step1(){
 return `<div class="hd"><div class="hg"><h2>New document</h2>${TS()}<button class="x" aria-label="Close" data-toast="Closed (prototype)">${ic('close')}</button></div><div class="sub">Step 1 of 2</div><div class="bar b1"><i></i><i></i></div></div>
 <div class="body"><h3>What do you want to create?</h3><div class="tiles">${Object.keys(DOCS).map(k=>`<button class="tile ${k=='PWD cert'?'w':''} ${S.doc==k?'on':''}" data-d="${k}">${ic(DOCS[k])}${k}</button>`).join('')}</div>
 ${S.draft?`<div class="draft"><div class="dt">${ic('draft')}<span>You have an unsaved draft from 26 min ago</span></div><div class="da"><button data-x="1">${ic('del')}Discard</button><button data-go="2" data-toast="Draft restored">${ic('restore')}Restore</button></div></div>`:''}</div>
 <div class="ft f1"><button class="btn" data-toast="Cancelled (prototype)">Cancel</button><button class="btn p" data-go="2">Continue with ${S.doc.toLowerCase().replace('pwd','PWD')}</button></div>`}

function step2(){
 const rx=S.doc=='Prescription',ok=rx;
 const notes=`<span class="lab">Additional notes</span>${ta('notes','Optional notes for the patient or pharmacist')}`;
 const rxForm=`<div class="mc"><div class="mh">Medication 1<button data-toast="Prototype: removes this medication">${ic('del')}Remove</button></div><div class="g">${cell('drug')}${cell('brand')}${cell('strength',1)}${cell('form')}${cell('qty')}${cell('freq',1)}${cell('dur',1)}${cell('sig',1)}</div></div><button class="add" data-toast="Prototype: adds another Medication card">${ic('add')}Add another medication</button>${notes}`;
 const form=`<div class="dr"><button class="field fl" style="width:auto;min-width:15rem">${ic('cal')}October 5th, 2026</button><div class="seg">${['Write','Preview'].map(m=>`<button class="${S.mode==m?'on':''}" data-mode="${m}">${m}</button>`).join('')}</div></div>`+(S.mode=='Preview'?paper():rxForm);
 const sh=S.sheet&&rx?`<div class="ov" data-close="1"><div class="sh" onclick="event.stopPropagation()"><div class="r"><b style="font-size:1.4rem">${L[S.sheet]}</b><button class="x" data-close="1" aria-label="Close">${ic('close')}</button></div><div class="field ph fl" style="margin-top:.5rem">${ic('search')}${PH[S.sheet]}</div>${rows(S.sheet,S.sheet=='strength'?sOpts():O[S.sheet])}</div></div>`:'';
 const sm=rx?`${S.drug}${S.strength?', '+(S.strength.length>24?S.strength.slice(0,24)+'…':S.strength):''} · ${S.form} · ${S.qty} · ${S.freq} · ${S.dur}`:`${S.purpose||'Purpose'} · ${S.find||'Diagnosis / findings'}`;
 const strip=ok&&S.mode=='Write'?`<button class="strip" data-mode="Preview">${ic('eye')}<span>${sm}</span><b>Preview</b></button>`:'';
 const gen='prescription';
 return `<div class="hd"><div class="r"><button class="back" data-go="1">${ic('back')}Back</button><button class="x" data-go="1" aria-label="Close">${ic('close')}</button></div><div class="r tr"><h2>${S.doc}</h2>${TS()}</div><div class="sub">Step 2 of 2</div><div class="bar s"><i></i><i></i></div></div>
 <div class="main"><div class="body">${ok?form:`<p class="ph" style="margin-top:1.5rem">Medical certificate, Mental health certificate, Lab request, Referral, Sick leave and PWD cert keep their existing forms (not redesigned here). Go back and choose Prescription to see the redesigned form.</p>`}</div>${ok?`<aside class="pv"><b style="font-size:1.2rem">Live preview</b><div style="height:.8rem"></div>${paper()}</aside>`:''}</div>
 ${strip}<div class="ft"><div class="saved">Draft saved 9:20 AM</div><div class="fr"><button class="btn" data-go="1">Cancel</button><button class="btn pvb" data-mode="Preview">Preview</button><button class="btn p" data-toast="Prototype: ${gen} generated">Generate ${gen}</button></div></div>${sh}`}

function tool(){const cur=S.step==1?'1':S.doc=='Medical certificate'?'cert':S.doc=='Prescription'?'rx':'';
 document.getElementById('tool').innerHTML=`<div class="tg">View ${['auto','mobile','tablet','desktop'].map(d=>`<button class="${S.dev==d?'on':''}" data-dev="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div><div class="tg">Screen ${[['1','Step 1'],['rx','Prescription step 2']].map(([k,t])=>`<button class="${cur==k?'on':''}" data-jump="${k}">${t}</button>`).join('')}</div>`}
function fontPx(){const ph=matchMedia('(max-width:520px)').matches||S.dev=='mobile';document.documentElement.style.fontSize=({16:16,19:ph?17:18,22:ph?18:20})[S.fs]+'px'}
window.addEventListener('resize',fontPx);
function render(){
 const b=document.querySelector('.body'),st=b?b.scrollTop:0,w=document.getElementById('w');
 fontPx();document.documentElement.dataset.dev=S.dev;
 w.className='wrap'+(S.step==2?' s2':'');
 document.getElementById('pill').textContent=S.step==1?'Step 1 of 2: choose the document':'Step 2 of 2: '+S.doc.toLowerCase();
 document.getElementById('m').innerHTML=S.step==1?step1():step2();tool();
 const nb=document.querySelector('.body');if(nb)nb.scrollTop=st}
function toast(t){const e=document.getElementById('t');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
document.addEventListener('click',e=>{const b=e.target.closest('button,.ov');if(!b)return;const d=b.dataset;let top=false,ch=true;
 if(d.fs){S.fs=+d.fs;try{localStorage.setItem('rxfs',d.fs)}catch(x){}}
 else if(d.dev)S.dev=d.dev;
 else if(d.jump){S.sheet=null;S.mode='Write';top=true;if(d.jump=='1')S.step=1;else{S.step=2;S.doc=d.jump=='cert'?'Medical certificate':'Prescription'}}
 else if(d.d)S.doc=d.d;else if(d.x)S.draft=false;
 else if(d.k){S[d.k]=d.v;if(d.k=='drug')S.strength='';S.sheet=null}
 else if(d.q)S.qty=Math.max(1,S.qty+ +d.q);
 else if(d.sig!==undefined){S.sig=d.sig;S.sigOpen=false}
 else if(d.sheet)S.sheet=d.sheet;else if(d.close)S.sheet=null;else if(d.mode){S.mode=d.mode;top=d.mode=='Preview'}
 else if(d.go){S.step=+d.go;S.sheet=null;S.mode='Write';top=true}
 else if(!d.toast)ch=false;
 if(d.go&&d.toast){S.step=+d.go;top=true}
 if(d.toast)toast(d.toast);
 if(ch){render();if(top){const n=document.querySelector('.body');if(n)n.scrollTop=0}}});
document.addEventListener('focusin',e=>{if(e.target.dataset.t=='sig'){S.sigOpen=true;const x=document.getElementById('sigdd');if(x)x.hidden=false}});
document.addEventListener('mousedown',e=>{if(S.sigOpen&&!e.target.closest('.ddw')){S.sigOpen=false;const x=document.getElementById('sigdd');if(x)x.hidden=true}});
document.addEventListener('input',e=>{const k=e.target.dataset.t;if(!k)return;S[k]=e.target.value;document.querySelectorAll('[data-pv]').forEach(p=>p.innerHTML=pvh())});
render();
</script></body></html>
